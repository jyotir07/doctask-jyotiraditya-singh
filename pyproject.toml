[project]
name = "doctask"
version = "0.1.0"
description = "An agentic system that owns a pile of vendor contracts, amendments and invoices end to end."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "python-docx>=1.2",
    "reportlab>=5.0",
    "mcp>=2.1",
    "python-dotenv>=1.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-anyio", "anyio>=4.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "requires_db: test needs a live PostgreSQL instance",
]
filterwarnings = ["error"]
